version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.2-90b-vision-preview}
    ports:
      - "8080:8080"
  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
